version: '3.8'

services:
  freight-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freight-backend
    ports:
      - "5262:8080"
      - "7135:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - freight-network

networks:
  freight-network:
    driver: bridge
